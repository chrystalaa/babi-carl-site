<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You 💙</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #cfe8ff, #4da3ff);
      color: #0f172a;
      overflow-x: hidden;
    }

    .container {
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #1d4ed8;
    }

    p {
      line-height: 1.6;
    }

    /* gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    /* hearts */
    .heart {
      position: fixed;
      font-size: 18px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- MESSAGE SECTION -->
  <div class="card">
    <h1>Hi, Love 💙</h1>
    <p>
      I just wanted to make something simple for you.
      Thank you for being patient, kind, and always staying.
      You mean a lot to me.
    </p>

    <!-- Spotify Embed -->
    <iframe style="border-radius:12px"
      src="https://open.spotify.com/embed/track/2btKtacOXuMtC9WjcNRvAA?utm_source=generator"
      height="152"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

  <!-- GALLERY SECTION -->
  <div class="card">
    <h1>Our Memories 📸</h1>

    <div class="gallery">
      <img src="https://picsum.photos/300/300?random=1" />
      <img src="https://picsum.photos/300/300?random=2" />
      <img src="https://picsum.photos/300/300?random=3" />
      <img src="https://picsum.photos/300/300?random=4" />
      <img src="https://picsum.photos/300/300?random=5" />
      <img src="https://picsum.photos/300/300?random=6" />
    </div>
  </div>

</div>

<script>
function hearts() {
  const h = document.createElement("div");
  h.classList.add("heart");
  h.innerHTML = "💙";
  h.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}
setInterval(hearts, 500);
</script>

</body>
</html>
